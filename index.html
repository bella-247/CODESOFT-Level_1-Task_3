<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale = 1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" class="css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="calc-container">
        <div class="message-box"></div>
        <div class="display-container">
            <input type="text" class="display" data-state = 'expression' disabled/>
        </div>
        <div class="btns-container">
            <div class="btns specials clear">Clr</div>
            <div class="btns specials del">Del</div>
            <div class="btns parenthesis">( )</div>
            <div class="btns operations">/</div>
            <div class="btns numbers">7</div>
            <div class="btns numbers">8</div>
            <div class="btns numbers">9</div>
            <div class="btns operations">*</div>
            <div class="btns numbers">4</div>
            <div class="btns numbers">5</div>
            <div class="btns numbers">6</div>
            <div class="btns operations">-</div>
            <div class="btns numbers">1</div>
            <div class="btns numbers">2</div>
            <div class="btns numbers">3</div>
            <div class="btns operations plus">+</div>
            <div class="btns numbers">0</div>
            <div class="btns dot">.</div>
            <div class="btns equal">=</div>
        </div>
    </div>

</body>
</html>
